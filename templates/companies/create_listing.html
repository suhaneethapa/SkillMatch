{% extends 'base.html' %}

{% block title %}Post Internship - SkillMatch{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body p-4">
                <h4 class="mb-4">Post New Internship</h4>
                <form method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" name="title" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Category</label>
                            <select name="category" class="form-select" required>
                                {% for cat in categories %}
                                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="4" required></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Location</label>
                            <select name="location_type" class="form-select" required>
                                <option value="remote">Remote</option>
                                <option value="onsite">Onsite</option>
                                <option value="hybrid">Hybrid</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Stipend (NPR)</label>
                            <input type="number" name="stipend" class="form-control">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Positions</label>
                            <input type="number" name="total_positions" class="form-control" min="1" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Deadline</label>
                            <input type="date" name="deadline" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Duration</label>
                            <input type="text" name="expected_duration" class="form-control" placeholder="e.g. 3 months" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Required Skills (Ctrl+Click to select multiple)</label>
                        <select name="required_skills" class="form-select" multiple size="4" required>
                            {% for skill in skills %}
                                <option value="{{ skill.id }}">{{ skill.name }} ({{ skill.category.name }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Preferred Skills (optional)</label>
                        <select name="preferred_skills" class="form-select" multiple size="4">
                            {% for skill in skills %}
                                <option value="{{ skill.id }}">{{ skill.name }} ({{ skill.category.name }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Post Internship</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
