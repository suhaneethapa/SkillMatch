{% extends 'base.html' %}

{% block extra_css %}
<style>
    .admin-sidebar .nav-link {
        color: var(--text-secondary) !important;
        font-weight: 600;
        font-size: 0.85rem;
        padding: 10px 14px;
        border-radius: var(--radius-md);
        margin-bottom: 4px;
        transition: var(--transition);
    }
    .admin-sidebar .nav-link:hover {
        color: var(--primary) !important;
        background: var(--primary-light);
    }
    .admin-sidebar .nav-link.active {
        color: white !important;
        background: var(--primary);
        box-shadow: var(--shadow-sm);
    }
</style>
{% endblock %}

{% block content %}
<div class="sm-page">
    <div class="row g-3">
        <div class="col-md-2">
            <div class="sm-card">
                <div class="sm-card-body-p3">
                    <h6 class="mb-3 text-uppercase small fw-bold" style="color: var(--text-muted); letter-spacing: 0.05em;">Admin Menu</h6>
                    <ul class="nav nav-pills flex-column admin-sidebar">
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'admin_panel:dashboard' %}">Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'user_list' %}active{% endif %}" href="{% url 'admin_panel:user_list' %}">Users</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'company_list' %}active{% endif %}" href="{% url 'admin_panel:company_list' %}">Companies</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'internship_list' %}active{% endif %}" href="{% url 'admin_panel:internship_list' %}">Listings</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'application_list' %}active{% endif %}" href="{% url 'admin_panel:application_list' %}">Applications</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'skill_list' %}active{% endif %}" href="{% url 'admin_panel:skill_list' %}">Skills</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'category_list' %}active{% endif %}" href="{% url 'admin_panel:category_list' %}">Categories</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'journal_list' %}active{% endif %}" href="{% url 'admin_panel:journal_list' %}">Journals</a>
                        </li>
                        <li class="nav-item mt-2">
                            <a class="nav-link" href="{% url 'admin:index' %}" target="_blank">Django Admin</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-md-10">
            {% block admin_content %}{% endblock %}
        </div>
    </div>
</div>
{% endblock %}
