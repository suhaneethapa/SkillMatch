{% extends 'admin_panel/base_admin.html' %}

{% block title %}Add Skill - SkillMatch{% endblock %}

{% block admin_content %}
<div class="sm-page-narrow">
    <div class="sm-card">
        <div class="sm-card-body">
            <h4 class="mb-4" style="font-weight: 700;">Add New Skill</h4>
            <form method="post" class="sm-form">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Skill Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Category</label>
                    <select name="category" class="form-select" required>
                        {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Add Skill</button>
                    <a href="{% url 'admin_panel:skill_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
