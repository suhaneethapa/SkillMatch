{% extends 'base.html' %}

{% block title %}Edit Profile - SkillMatch{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body p-4">
                <h4 class="mb-4">Edit Profile</h4>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Department</label>
                            <input type="text" name="department" class="form-control" value="{{ profile.department }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Semester</label>
                            <input type="number" name="semester" class="form-control" value="{{ profile.semester }}" min="1" max="8" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">College</label>
                        <select name="college" class="form-select" required>
                            {% for college in colleges %}
                                <option value="{{ college.id }}" {% if college.id == profile.college_id %}selected{% endif %}>{{ college.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Bio</label>
                        <textarea name="bio" class="form-control" rows="3">{{ profile.bio }}</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">GitHub URL</label>
                            <input type="url" name="github_url" class="form-control" value="{{ profile.github_url|default:'' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">LinkedIn URL</label>
                            <input type="url" name="linkedin_url" class="form-control" value="{{ profile.linkedin_url|default:'' }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">CV Upload (PDF or DOCX, max 5MB)</label>
                        <input type="file" name="cv_file" class="form-control" accept=".pdf,.docx">
                        {% if profile.cv_file %}
                            <p class="small text-muted mt-1">Current: <a href="{{ profile.cv_file.url }}" target="_blank">{{ profile.cv_file.name }}</a></p>
                        {% endif %}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a href="{% url 'students:profile' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
